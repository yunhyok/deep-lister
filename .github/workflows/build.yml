name: Build Windows Installer

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "빌드한 인스톨러로 GitHub Release(v<현재 버전>) 게시 (main 브랜치 전용)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest -v

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $found = (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -or
                   (Test-Path -LiteralPath (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'))
          if (-not $found) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }

      - name: Build EXE and Inno Setup Installer
        shell: pwsh
        run: |
          .\packaging\build.ps1

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepLister-Windows-Installer
          path: installer/DeepListerSetup-*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build-windows
    # A pushed v* tag, or a manual run on main with "publish_release" ticked
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Installer Artifact
        uses: actions/download-artifact@v4
        with:
          name: DeepLister-Windows-Installer
          path: release-assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' deeplister/__init__.py)"
          if [[ -z "${version}" ]]; then
            echo "::error::deeplister/__init__.py 에서 버전을 읽지 못했습니다."
            exit 1
          fi
          tag="v${version}"

          if [[ "${GITHUB_REF}" == refs/tags/* && "${GITHUB_REF_NAME}" != "${tag}" ]]; then
            echo "::error::태그 ${GITHUB_REF_NAME} 와 패키지 버전 ${version} 이 일치하지 않습니다."
            exit 1
          fi

          if gh release view "${tag}" > /dev/null 2>&1; then
            echo "::notice::릴리즈 ${tag} 가 이미 있어 게시를 건너뜁니다."
            exit 0
          fi

          installer="release-assets/DeepListerSetup-${version}.exe"
          if [[ ! -f "${installer}" ]]; then
            echo "::error::인스톨러 ${installer} 가 없습니다."
            exit 1
          fi

          # Release notes = this version's CHANGELOG section + installer checksum
          awk -v ver="${version}" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) { found = 1 }; next }
            found { print }
          ' CHANGELOG.md > changes.md
          if ! grep -q '[^[:space:]]' changes.md; then
            echo "::error::CHANGELOG.md 에 [${version}] 항목이 없습니다."
            exit 1
          fi

          size_mb="$(awk -v bytes="$(stat -c %s "${installer}")" 'BEGIN { printf "%.2f", bytes / 1048576 }')"
          sha256="$(sha256sum "${installer}" | cut -d ' ' -f 1 | tr '[:lower:]' '[:upper:]')"
          {
            echo "## DeepLister ${tag} (Windows x64)"
            cat changes.md
            echo
            echo "### Windows 설치 파일"
            echo "- 파일명: \`DeepListerSetup-${version}.exe\` (${size_mb} MB)"
            echo "- SHA-256: \`${sha256}\`"
          } > notes.md

          gh release create "${tag}" "${installer}" \
            --target "${GITHUB_SHA}" \
            --title "DeepLister ${tag}" \
            --notes-file notes.md
