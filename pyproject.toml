[project]
name = "deep-lister"
version = "1.1.0"
description = "Windows GUI tool to recursively list folders, files, and nested archives into Excel (.xlsx)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "yunhyok" }]
dependencies = [
    "PySide6>=6.8.0",
    "py7zr>=1.0.0",
    "openpyxl>=3.1.0",
    "Pillow>=11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
